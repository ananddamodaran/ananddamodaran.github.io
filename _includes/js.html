<script type="text/javascript" src="{{ site.url }}/js/main.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Theme Switcher
    var toggleBtn = document.getElementById('theme-toggle');
    var toggleIcon = document.getElementById('theme-toggle-icon');

    function updateThemeIcon() {
      if (document.body.classList.contains('dark-mode')) {
        if (toggleIcon) toggleIcon.className = 'fa fa-sun-o';
      } else {
        if (toggleIcon) toggleIcon.className = 'fa fa-moon-o';
      }
    }

    var savedTheme = localStorage.getItem('theme');
    if (savedTheme !== 'light') {
      document.body.classList.add('dark-mode');
    }
    updateThemeIcon();

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        var isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeIcon();
      });
    }

    // Copy Code Blocks
    var codeBlocks = document.querySelectorAll('pre');
    codeBlocks.forEach(function(pre) {
      if (pre.parentNode.classList.contains('highlight')) {
        var wrapper = document.createElement('div');
        wrapper.className = 'highlight-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        var copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.type = 'button';
        copyBtn.innerText = 'Copy';

        copyBtn.addEventListener('click', function() {
          var code = pre.querySelector('code') || pre;
          navigator.clipboard.writeText(code.innerText).then(function() {
            copyBtn.innerText = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(function() {
              copyBtn.innerText = 'Copy';
              copyBtn.classList.remove('copied');
            }, 2000);
          });
        });

        wrapper.appendChild(copyBtn);
      }
    });
  });
</script>
