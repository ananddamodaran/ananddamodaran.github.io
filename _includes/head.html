<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f5">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    (function() {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme !== 'light') {
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('dark-mode');
        });
      }
    })();
  </script>

  {% seo %}

  <!-- CSS files -->
  <link rel="stylesheet" href="{{ site.url }}/css/font-awesome.min.css">
  <link rel="stylesheet" href="{{ site.url }}/css/main.css">

  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | prepend: site.url }}" />

  <!-- Google Analytics 4 (Production Only) -->
  {% if jekyll.environment == "production" and site.owner.google.analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.owner.google.analytics }}"></script>
  <script>
    if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.owner.google.analytics }}');
    }
  </script>
  {% endif %}

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.owner.name }}",
    "jobTitle": "{{ site.owner.job }}",
    "url": "{{ site.url }}",
    "sameAs": [
      {% if site.owner.github %}"https://github.com/{{ site.owner.github }}",{% endif %}
      {% if site.owner.linkedin %}"https://linkedin.com/in/{{ site.owner.linkedin }}",{% endif %}
      {% if site.owner.twitter %}"https://twitter.com/{{ site.owner.twitter }}"{% endif %}
    ]
  }
  </script>

  <!-- Icons -->
  <link rel="shortcut icon" href="{{ site.url }}/favicon.ico">
  <link rel="shortcut icon" href="{{ site.url }}/favicon.png">
</head>
