- name: Snapooh Monitor
  descr: >
    Snapooh monitor is a mobile app used to capture and share photos with tamper-proof timestamps and geo-tags, linking them to media assets, points of interest, and Google Places.

    All photos captured by operation executives are stored in a centralized inbox with relevant tags and notes, which can be searched, viewed, and analyzed.
  playstore: https://play.google.com/store/apps/details?id=com.snapooh.snapoohmonitor
  website: http://www.snapooh.com

- name: Snapooh View
  descr: >
    Snapooh View facilitates receiving and sharing Out-Of-Home (OOH) media monitors on the go.
    A user-friendly app developed for SnapOOH vendors to view all information about monitors in their account inbox.

    Features:
    - Instant notification alerts on receiving new monitors
    - Single dashboard view displaying key monitor parameters
    - Detailed view of each monitor with geo tags, photos, maps, and alerts
    - Share monitors seamlessly with your team and clients
  playstore: https://play.google.com/store/apps/details?id=com.snapooh.monitorview
  website: http://www.snapooh.com
