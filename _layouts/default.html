<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body class="{% if page.layout %}{{ page.layout }}-layout{% endif %}">
  <div class="row">
    <div class="col s12 m3">
      <aside class="table cover">
        {% include sidebar.html %}
      </aside>
    </div>
    <div class="col s12 m9">
      <main class="post-listing {% if page.layout != 'post_listing' %}is-single-page{% endif %}">
        {{ content }}
        {% include footer.html %}
      </main>
    </div>
  </div>
  {% include js.html %}
</body>
</html>
